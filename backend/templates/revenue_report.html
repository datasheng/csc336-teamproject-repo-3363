<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapEats Revenue Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-size: .875rem;
        }
        .feather {
            width: 16px;
            height: 16px;
            vertical-align: text-bottom;
        }
        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            padding: 48px 0 0;
            box-shadow: inset -1px 0 0 rgba(0, 0, 0, .1);
        }
        .sidebar-sticky {
            position: relative;
            top: 0;
            height: calc(100vh - 48px);
            padding-top: .5rem;
            overflow-x: hidden;
            overflow-y: auto;
        }
        .nav-link {
            font-weight: 500;
            color: #333;
        }
        .nav-link .feather {
            margin-right: 4px;
            color: #727272;
        }
        .nav-link.active {
            color: #2470dc;
        }
        .nav-link.active .feather {
            color: inherit;
        }
        .navbar-brand {
            padding-top: .75rem;
            padding-bottom: .75rem;
            font-size: 1rem;
            background-color: rgba(0, 0, 0, .25);
            box-shadow: inset -1px 0 0 rgba(0, 0, 0, .25);
        }
        .navbar .navbar-toggler {
            top: .25rem;
            right: 1rem;
        }
        main {
            padding-top: 60px; 
        }
    </style>
</head>
<body>
    
    <header class="navbar navbar-dark sticky-top bg-dark flex-md-nowrap p-0 shadow">
        <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3" href="#">SnapEats Admin</a>
        <button class="navbar-toggler position-absolute d-md-none collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
    </header>

    <div class="container-fluid">
        <div class="row">
            <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="/">
                                <span data-feather="home"></span>
                                Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="#">
                                <span data-feather="bar-chart-2"></span>
                                Revenue Report
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Revenue Report</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <div class="btn-group me-2">
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="exportToCSV()">Export CSV</button>
                        </div>
                    </div>
                </div>

                <!-- Filters -->
                <div class="row mb-4">
                    <div class="col-md-3">
                        <label for="timeFilter" class="form-label">Time Span</label>
                        <select class="form-select" id="timeFilter" onchange="updateDashboard()">
                            <option value="week">This Week</option>
                            <option value="month">This Month</option>
                            <option value="season">This Season</option>
                            <option value="year" selected>This Year</option>
                            <option value="all">All Time</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="restFilter" class="form-label">Restaurant</label>
                        <select class="form-select" id="restFilter" onchange="updateDashboard()">
                            <option value="all">All Restaurants</option>
                            {% for r in restaurants %}
                            <option value="{{ r.restID }}">{{ r.restName }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <h4>Total Profit: $<span id="totalProfitDisplay">0.00</span></h4>
                    </div>
                </div>

                <!-- Chart -->
                <canvas class="my-4 w-100" id="revenueChart" width="900" height="380"></canvas>

                <!-- Table -->
                <h2>Order Details</h2>
                <div class="table-responsive">
                    <table class="table table-striped table-sm" id="reportTable">
                        <thead>
                            <tr>
                                <th scope="col">Order ID</th>
                                <th scope="col">Date</th>
                                <th scope="col">Restaurant</th>
                                <th scope="col">Customer</th>
                                <th scope="col">Total Amount ($)</th>
                                <th scope="col">Profit (10%) ($)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
    <!-- Feather Icons -->
    <script src="https://cdn.jsdelivr.net/npm/feather-icons@4.28.0/dist/feather.min.js"></script>

    <script>
        feather.replace({ 'aria-hidden': 'true' });

        // Data from Flask
        const rawOrders = {{ orders | tojson }};
        
        let chartInstance = null;

        function getSeason(date) {
            const month = date.getMonth(); // 0-11
            if (month >= 2 && month <= 4) return 'Spring';
            if (month >= 5 && month <= 7) return 'Summer';
            if (month >= 8 && month <= 10) return 'Autumn';
            return 'Winter';
        }

        function filterOrders() {
            const timeFilter = document.getElementById('timeFilter').value;
            const restFilter = document.getElementById('restFilter').value;
            
            const now = new Date();
            const startOfWeek = new Date(now);
            startOfWeek.setDate(now.getDate() - now.getDay()); // Sunday
            startOfWeek.setHours(0,0,0,0);

            const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
            const startOfYear = new Date(now.getFullYear(), 0, 1);

            let filtered = rawOrders.filter(o => {
                const oDate = new Date(o.orderTime);
                
                // Time Filter
                if (timeFilter === 'week' && oDate < startOfWeek) return false;
                if (timeFilter === 'month' && oDate < startOfMonth) return false;
                if (timeFilter === 'year' && oDate < startOfYear) return false;
                if (timeFilter === 'season') {
                    const currentSeason = getSeason(now);
                    const orderSeason = getSeason(oDate);
                    if (currentSeason !== orderSeason || oDate.getFullYear() !== now.getFullYear()) return false;
                }

                // Restaurant Filter
                if (restFilter !== 'all' && o.restID != restFilter) return false;

                return true;
            });
            return filtered;
        }

        function updateDashboard() {
            const orders = filterOrders();
            updateTable(orders);
            updateChart(orders);
            updateTotalProfit(orders);
        }

        function updateTable(orders) {
            const tbody = document.querySelector('#reportTable tbody');
            tbody.innerHTML = '';
            orders.forEach(o => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${o.orderID}</td>
                    <td>${o.orderTime}</td>
                    <td>${o.restName}</td>
                    <td>${o.customerName}</td>
                    <td>${o.totalAmount.toFixed(2)}</td>
                    <td>${o.profit.toFixed(2)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateTotalProfit(orders) {
            const total = orders.reduce((sum, o) => sum + o.profit, 0);
            document.getElementById('totalProfitDisplay').innerText = total.toFixed(2);
        }

        function updateChart(orders) {
            const ctx = document.getElementById('revenueChart');
            const timeFilter = document.getElementById('timeFilter').value;

            // Group Data
            const labels = [];
            const dataPoints = [];
            const grouped = {};

            orders.forEach(o => {
                let key;
                const d = new Date(o.orderTime);
                if (timeFilter === 'week' || timeFilter === 'month' || timeFilter === 'season') {
                    // By Day
                    key = d.toLocaleDateString();
                } else if (timeFilter === 'year' || timeFilter === 'all') {
                    // By Month
                    key = d.toLocaleString('default', { month: 'short', year: 'numeric' });
                }
                
                if (!grouped[key]) grouped[key] = 0;
                grouped[key] += o.profit;
            });

            for (const [key, value] of Object.entries(grouped)) {
                labels.push(key);
                dataPoints.push(value);
            }

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataPoints,
                        lineTension: 0,
                        backgroundColor: 'transparent',
                        borderColor: '#007bff',
                        borderWidth: 4,
                        pointBackgroundColor: '#007bff'
                    }]
                },
                options: {
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            boxPadding: 3
                        }
                    }
                }
            });
        }

        function exportToCSV() {
            const orders = filterOrders();
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Order ID,Date,Restaurant,Customer,Total Amount,Profit\n";

            orders.forEach(o => {
                const row = [
                    o.orderID,
                    o.orderTime,
                    `"${o.restName}"`, // Quote strings with spaces
                    `"${o.customerName}"`,
                    o.totalAmount.toFixed(2),
                    o.profit.toFixed(2)
                ].join(",");
                csvContent += row + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "revenue_report.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Init
        updateDashboard();
    </script>
</body>
</html>
